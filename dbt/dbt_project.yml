# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'airbnb_census_dw'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'airbnb_census_dw'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Configuring models
# Full documentation: https://docs.getdbt.com/reference/model-configs

models:
  airbnb_census_dw:
    # Bronze layer - raw data tables
    bronze:
      +materialized: table
      +schema: bronze
    # Silver layer - cleaned and validated data
    silver:
      +materialized: table
      +schema: silver
    # Gold layer - business-ready data
    gold:
      +materialized: table
      +schema: gold
      # Star schema dimension and fact tables
      star:
        +materialized: table
        +schema: gold
      # Mart tables - business intelligence views
      mart:
        +materialized: view
        +schema: gold

# Configuring snapshots
snapshots:
  airbnb_census_dw:
    +target_schema: snapshots
    +unique_key: id
    +strategy: timestamp
    +updated_at: updated_at

# Configuring variables
vars:
  # Variables can be used throughout dbt projects and are defined here
  # Learn more from the documentation: https://docs.getdbt.com/docs/building-a-dbt-project/building-models/using-variables
  start_date: '2020-05-01'
  end_date: '2021-04-30'