version: 2

sources:
  - name: raw
    description: Raw data from CSV files loaded by Airflow
    database: postgres
    schema: bronze

    tables:
      - name: raw_census_g01
        description: Raw Census G01 data - Selected Person Characteristics by Sex
        columns:
          - name: lga_code_2016
            tests:
              - not_null
              - unique
          - name: tot_p_m
            tests:
              - not_null
          - name: tot_p_f
            tests:
              - not_null

      - name: raw_census_g02
        description: Raw Census G02 data - Selected Medians and Averages
        columns:
          - name: lga_code_2016
            tests:
              - not_null
              - unique
          - name: median_age_persons
            tests:
              - not_null

      - name: raw_lga_mapping
        description: Raw LGA to Suburb mapping data
        columns:
          - name: lga_name
            tests:
              - not_null
          - name: suburb_name
            tests:
              - not_null

      - name: raw_nsw_lga_code
        description: Raw NSW LGA code mapping data
        columns:
          - name: lga_code
            tests:
              - not_null
              - unique
          - name: lga_name
            tests:
              - not_null

      - name: raw_airbnb_listings
        description: Raw Airbnb listings data from CSV files
        columns:
          - name: listing_id
            tests:
              - not_null
          - name: scraped_date
            tests:
              - not_null
          - name: host_id
            tests:
              - not_null
          - name: listing_neighbourhood
            tests:
              - not_null
          - name: property_type
            tests:
              - not_null
          - name: room_type
            tests:
              - not_null
          - name: accommodates
            tests:
              - not_null
          - name: price
            tests:
              - not_null
          - name: has_availability
            tests:
              - not_null